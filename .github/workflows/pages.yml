# Publishes site/ to GitHub Pages.
#
# "Deploy from a branch" only offers / or /docs as the source folder, and the
# built site lives in site/ — so Pages is driven from Actions instead. Set
# Settings -> Pages -> Source to "GitHub Actions" for this to take effect.
#
# Nothing is built here: the pipeline runs locally (it needs the 112 MB
# workbook exports, which are gitignored) and the rendered output is
# committed. This only uploads it.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
